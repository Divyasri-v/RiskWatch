services:
  # ---------- HDFS (storage layer) ----------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64   # also runs on Apple Silicon Macs
    container_name: namenode
    ports:
      - "9870:9870"   # HDFS web UI -> http://localhost:9870
    environment:
      - CLUSTER_NAME=riskwatch
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    platform: linux/amd64
    container_name: datanode
    depends_on: [namenode]
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
    volumes:
      - datanode_data:/hadoop/dfs/data

  # ---------- Kafka (ingestion layer, KRaft mode, no Zookeeper) ----------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ---------- MongoDB (serving layer) ----------
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---------- App: Spark + Python scripts + dashboard ----------
  app:
    build: .
    container_name: riskwatch-app
    depends_on: [namenode, datanode, kafka, mongo]
    ports:
      - "8501:8501"   # Streamlit dashboard -> http://localhost:8501
      - "4040:4040"   # Spark UI while a job runs -> http://localhost:4040
    volumes:
      - .:/app
    environment:
      - STORAGE_BASE=${STORAGE_BASE:-hdfs://namenode:9000/riskwatch}
    command: sleep infinity   # stays running; we run scripts with "docker compose exec"

volumes:
  namenode_data:
  datanode_data:
  mongo_data:
